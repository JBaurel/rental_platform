spring:
  application:
    name: rental-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rental}
    username: ${DB_USER:rental}
    password: ${DB_PASSWORD:rental}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info