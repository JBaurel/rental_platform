services:
  db:
    image: postgres:17-alpine
    container_name: rental-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rental}
      POSTGRES_USER: ${POSTGRES_USER:-rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rental}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: rental-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rental}
      DB_USER: ${POSTGRES_USER:-rental}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rental}
      # Logs JSON structurés (ELK / Splunk)
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

  # redis:
  #   image: redis:7-alpine
  #   ports: ["6379:6379"]
  # rabbitmq:
  #   image: rabbitmq:3-management-alpine
  #   ports: ["5672:5672", "15672:15672"]

volumes:
  pgdata:
